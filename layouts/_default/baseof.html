<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <!-- 引入你的自定义 CSS，Hugo 会自动处理路径 -->
    {{ $style := resources.Get "css/style.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
</head>
<body>
    <nav class="top-nav">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
            {{ $isActive := $currentPage.IsMenuCurrent "main" . }}

        <a href="{{ .URL }}" class="nav-link{{ if $isActive }} active{{ end }}">
            {{ .Name }}
        </a>
        {{ end }}
        {{ partial "lang-switch.html" . }}
    </nav>
    <main class="cv-container">
        <!-- 这里会注入 single.html 的内容 -->
        {{ block "main" . }}{{ end }}
    </main>
    
    <div class="download-group no-print">
        <button class="download-btn" onclick="printResume('en')">Print CV</button>
        <button class="download-btn" onclick="printResume('zh')">打印简历</button>
    </div>

    <script>
    function printResume(lang) {
        var url = (lang === 'zh') ? '/zh/resume/' : '/resume/';
        var printWindow = window.open(url, '_blank');
        printWindow.onload = function() {
            printWindow.print();
        };
    }
    </script>
</body>
</html>
