{{ define "main" }}
<article class="cv-content">
    <!-- 头部：姓名与一句话定位 -->
    <header class="cv-header">
        <h1>{{ .Title }}</h1>
        <p class="cv-tagline">{{ .Params.tagline }}</p>
    </header>
    <!-- 主体内容：Markdown 渲染出的 HTML -->
    <div class="cv-body">
        <img src="/images/qvjizh.jpg" class="avatar">
        {{ .Content }}
    </div>

    <!-- 页脚 -->
    <footer class="cv-footer">
        <p>Last modified: {{ .Lastmod.Format "2006-01-02" }} | <a href="mailto:zjh239@foxmail.com">zjh239@foxmail.com</a></p>
    </footer>
</article>
{{ end }}
